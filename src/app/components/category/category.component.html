@if (category(); as category) {
  <ion-item [routerLink]="['/category', category.id]" [detail]="false">
    <ion-label class="ion-text-wrap">
      <h2 >{{ category.name }}
        <span class="date">
          @if (isIos()) {
            <ion-icon aria-hidden="true" name="chevron-forward" size="small"></ion-icon>
          }
        </span>
      </h2>
    </ion-label>
  </ion-item>
}
