<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-button slot="start" (click)="downloadCSV()">
      <ion-icon name="download-outline"></ion-icon>
    </ion-button>
    
    <ion-title>
      Home
    </ion-title>

    <ion-button slot="end" (click)="signOut()">
      <ion-icon name="log-out-outline"></ion-icon>
      Sign Out
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  
  <ion-header>
    <ion-toolbar>
      <ion-title>
        Select Category
      </ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    @for (cat of (categories$ | async); track cat) {
      <app-category [category]="cat"></app-category>
    }
  </ion-list>
</ion-content>
